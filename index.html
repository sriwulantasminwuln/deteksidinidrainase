<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard IoT - Deteksi Dini Penyumbatan Drainase Tertutup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    
    <!-- HEADER -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Deteksi Dini Penyumbatan Drainase Tertutup</h1>
        <p class="text-slate-500 text-sm mt-1">Sistem Pemantauan Berbasis Internet of Things (IoT)</p>
      </div>
      <div class="flex items-center gap-2 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Sistem Online
      </div>
    </header>

    <!-- KONTEN UTAMA DASHBOARD SENSOR -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tinggi Air</h3>
        <p class="text-3xl font-extrabold text-slate-900">-- <span class="text-sm font-normal text-slate-500">cm</span></p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Debit Air</h3>
        <p class="text-3xl font-extrabold text-slate-900">-- <span class="text-sm font-normal text-slate-500">L/min</span></p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Status Penyumbatan</h3>
        <p class="text-3xl font-extrabold text-emerald-600">NORMAL</p>
      </div>
    </main>

  </div>
</body>
</html>
